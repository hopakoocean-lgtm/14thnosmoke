    <!-- Main Container -->

    <!-- JavaScript Data and Logic -->
    <script>
        // 430 Full Questions Data Array
        const rawQuestions = [
            { id: 1, q: "中國已禁止發佈煙草廣告,違法者將被處以罰款,最高罰金為多少元?", a: "100萬" },
            { id: 2, q: "以下哪個城市對電子煙專賣店的違規進行處置,是內地的首例執法?", a: "深圳" },
            { id: 3, q: "加強青少年控煙工作的核心內容是什麼?", a: "強化青少年控煙宣傳引導、加大對違法煙草廣告的打擊力度、全面開展電子煙危害宣傳和規範管理" },
            { id: 4, q: "中國《電子煙管理辦法》有如下規定。", a: "禁止銷售可自行添加霧化物的電子煙;禁止向未成年人銷售電子煙;只可在獲得煙草專賣許可證的店鋪銷售;禁止自動售貨機銷售電子煙;禁止舉辦電子煙展會等。" },
            { id: 5, q: "根據中國境內銷售捲煙的包裝標識的規定,包裝上標註的焦油量不得超過多少毫克?", a: "15毫克" },
            { id: 6, q: "2024年中國內地首個室外吸煙點標準規範在哪個城市實施?", a: "上海" },
            { id: 7, q: "中國內地2011年頒布的《公共場所衛生管理條例實施細則》規定室外公共場所設置的吸煙區不得位於以下哪個位置?", a: "行人必經的通道上" },
            { id: 8, q: "以下哪個省份明確城市公共場所、室內工作場所和公共交通工具內禁止吸電子煙?", a: "河南省" },
            { id: 9, q: "「健康中國行動(2019-2030年)」的行動計畫包括:", a: "健康環境促進行動、合理膳食行動、心腦血管疾病防治行動、中小學生健康促進行動" },
            { id: 10, q: "《中華人民共和國廣告法》規定禁止發布煙草廣告,禁止在公共場所設置煙草廣告。違規者最高可被處以廣告費多少倍的罰款?", a: "5倍" },
            { id: 11, q: "《煙草控制框架公約》於何時在中國生效?", a: "2006年1月9日" },
            { id: 12, q: "中國《電子煙管理辦法》中,除什麼口味以外的電子煙均禁止銷售?", a: "煙草口味" },
            { id: 13, q: "中國《電子煙管理辦法》規定,禁止向多少歲以下的人出售電子煙產品。", a: "18歲以下" },
            { id: 14, q: "中國控制吸煙協會設立了一個什麼獎項,警示影視製作團隊在其作品中夾雜太多吸煙鏡頭和煙草廣告?", a: "髒煙灰缸獎" },
            { id: 15, q: "內地哪個城市成人吸煙率率先降至20%以內,在全國處於領先水準?", a: "上海" },
            { id: 16, q: "北京市禁止在幼兒園、中小學校、少年宮及其周邊多少米範圍內銷售煙草製品?", a: "100米" },
            { id: 17, q: "很多國家或地區已禁止煙草廣告、促銷和贊助,其原因是這類煙草推廣造成了何種不良影響?", a: "美化吸煙行為,增加煙草消費;削弱公共衛生的影響;誤導公眾,降低戒煙動力" },
            { id: 18, q: "哪個城市全國首創在禁煙區域安裝環境監測器,24小時「電子眼」控煙?", a: "深圳" },
            { id: 19, q: "繼澳門後,以下哪個城市在2019年將巴士站劃出了禁煙範圍?", a: "深圳" },
            { id: 20, q: "《健康中國2030規劃綱要》指出,到2030年15歲以上人群吸煙率降低到多少百分比?", a: "20%" },
            { id: 21, q: "中國哪個城市推出了全國首個違禁吸煙抓拍系統?", a: "舟山" },
            { id: 22, q: "在國內,以下哪個交通工具內尚未全面禁煙?", a: "綠皮火車" },
            { id: 23, q: "據統計,全世界每年發生的火災有百分之多少是由吸煙引起的?", a: "20%" },
            { id: 24, q: "女性吸煙者數量最多的國家是?", a: "美國" },
            { id: 25, q: "根據WHO數據顯示,全球範圍內,人們開始經常吸煙的平均年齡是多少歲?", a: "19歲" },
            { id: 26, q: "本澳以下哪一個年齡段組別煙草使用率最高?", a: "35-44" },
            { id: 27, q: "全球煙草使用趨勢顯示,以下哪個因素最有效地降低了吸煙率?", a: "煙草稅的增加" },
            { id: 28, q: "據研究,英國在無煙害法案立法後,醫院哪類型的病人數量急遽下降?", a: "氣喘的兒童" },
            { id: 29, q: "中國每年因吸煙相關疾病死亡的人數大約是多少?", a: "100萬以上" },
            { id: 30, q: "以下哪個國家成年男性的吸煙率最高?", a: "印尼" },
            { id: 31, q: "因違反《控煙法》規定而實施制裁的罰款所得,全數歸哪個政府部門所有?", a: "衛生局" },
            { id: 32, q: "在距離標示集體客運車輛停車處的信號少於多少米範圍內禁止吸煙?", a: "10米" },
            { id: 33, q: "根據《控煙法》,煙草製品的生產商或進口商將其在澳門銷售的煙草製品生產配料及其份量的清單提交給以下哪一個政府部門?", a: "衛生局" },
            { id: 34, q: "現時違法吸煙者除可前往各衛生局中心及控煙辦公室繳付罰款外,還可到哪些地方繳交罰款?", a: "澳門中國銀行及各支行" },
            { id: 35, q: "澳門《控煙法》規定每人每日可從境外攜帶捲煙多少支入境?", a: "19支" },
            { id: 36, q: "本澳禁止出售含有多少毫克以上尼古丁的煙草?", a: "1.5毫克" },
            { id: 37, q: "澳門禁止向未滿18歲人士銷售煙草製品,如違反將被科以罰款澳門幣多少元?", a: "20000元" },
            { id: 38, q: "控煙法修法內容包括:", a: "禁止在供集體使用的地方消費或管有電子煙;擴大室外禁煙範圍;對煙草製品實施標準化包裝制度及增加警示標籤比例。" },
            { id: 39, q: "有關標準化包裝制度及擴大警示標籤的規定,將於何時實施?", a: "2028/7/1" },
            { id: 40, q: "政府推行控煙工作秉持的原則是什麼?", a: "健康促進、先易後難、循序漸進" },
            { id: 41, q: "根據澳門《控煙法》,標籤的規定有哪些?", a: "以不褪色的方式印刷;各式樣均由圖案、健康警語、衛生局戒煙專科門診的電話號碼組成;捲煙獨立包裝上需印行政法規核准式樣,一面印中文,一面印葡文。" },
            { id: 42, q: "針對禁止消費與管有電子煙的規定,將於何時實施?", a: "2027/7/1" },
            { id: 43, q: "控煙法修法內容加強對電子煙管制的原因是什麼?", a: "電子煙易於隱藏;鄰近地區有被用於吸食毒品的情況;防止其被用於吸食毒品。" },
            { id: 44, q: "控煙法修法內容將攜帶新興吸煙產品出入境的罰款提高的主要目的是什麼?", a: "加強阻嚇力" },
            { id: 45, q: "控煙法修法內容規定,距離小學及中學教育場所出入口少於多少米的範圍內禁止吸煙?", a: "10米" },
            { id: 46, q: "控煙法修法內容規定,距離醫院出入口少於多少米的範圍內禁止吸煙?", a: "10米" },
            { id: 47, q: "控煙法修法內容規定,監察人員使用隨身攝錄機攝錄前應如何操作?", a: "應清楚告知對方開始錄影" },
            { id: 48, q: "控煙法修法內容規定的室外禁煙範圍,具體參照目前何種設施的模式執行?", a: "巴士站" },
            { id: 49, q: "控煙法修法內容規定雪茄及小雪茄的標籤式樣應至少占兩個最大表面各多少面積?", a: "70%" },
            { id: 50, q: "控煙法修法內容規定對煙草製品實施何種包裝制度?", a: "標準化包裝制度" },
            { id: 51, q: "控煙法修法內容規定監察人員在何種情況下可以使用隨身攝錄機?", a: "處於危險、緊急或擾亂公共秩序等類似情況下" },
            { id: 52, q: "控煙法修法內容規定隨身攝錄機取得的攝錄資料最長保存多久?", a: "7日" },
            { id: 53, q: "控煙法修法內容禁止尼古丁袋等產品的主要考慮是什麼?", a: "避免青少年誤以為無害或不易上癮,從而養成吸煙習慣(“入門效應”)" },
            { id: 54, q: "控煙法修法內容禁止尼古丁袋等新興吸煙產品製造及流通的主要目的是什麼?", a: "防止該類產品在澳門市場擴大及形成消費規模" },
            { id: 55, q: "控煙法修法內容禁止的尼古丁製品包括以下哪種?", a: "尼古丁袋(俗稱“口含煙”)" },
            { id: 56, q: "控煙法修法內容禁止製造及流通的新興吸煙產品包括哪些?", a: "尼古丁袋(俗稱“口含煙”)、草本煙、水煙" },
            { id: 57, q: "控煙法修法內容實施標準化包裝制度及擴大警示標籤的主要目的是什麼?", a: "削弱煙草包裝對公眾的吸引力,降低煙草對年輕人的吸引力" },
            { id: 58, q: "控煙法修法內容對捲煙包裝的要求應以何種方式訂定?", a: "公佈於《澳門特別行政區公報》的行政長官批示" },

            { id: 61, q: "控煙法修法內容增加煙草製品警示標籤比例是應哪個國際組織的建議?", a: "世界衛生組織" },

            { id: 278, q: "關於“薄荷醇捲煙”,以下哪項正確?", a: "薄荷醇的麻醉作用使吸煙者吸入更深、更久,可能增加危害" },

            { id: 416, q: "關於電子煙導致的電子煙肺損傷,其主要原因被認為是煙油中的何種添加劑?", a: "醋酸維他命E" },
            { id: 417, q: "“太空油”名稱的由來與什麼有關?", a: "吸入後有輕飄飄失重的感覺" },
            { id: 418, q: "“太空油”吸食方式隱蔽性強的原因是什麼?", a: "可通過電子煙在公眾場所輕易使用" },
            { id: 419, q: "“太空油”的成癮性如何?", a: "成癮性極高" },
            { id: 420, q: "“太空油”的濫用人群呈現什麼趨勢?", a: "年輕化" },
            { id: 421, q: "女性濫用依託咪酯可能面臨哪種特殊健康風險?", a: "月經紊亂和生育能力受影響" },
            { id: 422, q: "吸食“太空油”後,吸食者可能出現哪種運動方面的症狀?", a: "肌肉不自主抽搐" },
            { id: 423, q: "吸食“太空油”後,吸食者皮膚可能出現什麼變化?", a: "變得灰黑" },
            { id: 424, q: "依託咪酯在醫學上原本的用途是什麼?", a: "麻醉" },
            { id: 425, q: "依託咪酯被濫用時,最常見的給藥途徑是什麼?", a: "霧化吸入" },
            { id: 426, q: "依託咪酯濫用者可能出現哪種精神症狀?", a: "幻覺、恐懼和焦慮" },
            { id: 427, q: "依託咪酯濫用者尿檢中常發現被混入的其他毒品包括什麼?", a: "冰毒和氯胺酮" },
            { id: 428, q: "長期濫用依托咪酯可能對大腦造成什麼影響?", a: "不可逆的腦部損傷和精神障礙" },
            { id: 429, q: "香港將依託咪酯列為毒品後,販運該毒品的最高刑罰是什麼?", a: "終身監禁及罰款500萬元" },
            { id: 430, q: "部分“太空油”中可能被混入以下哪種毒品?", a: "氯胺酮(K仔)" }
        ];

        // State Management
        let currentFilteredList = [...rawQuestions];
        let currentPage = 1;
        let pageSize = 10;
        let userAnswers = {}; // Store user text inputs { questionId: "user text" }
        let revealedAnswers = {}; // Store reveal status { questionId: boolean }
        let allRevealedOnPage = false;

        // Elements
        const questionsContainer = document.getElementById('questionsContainer');
        const paginationControls = document.getElementById('paginationControls');
        const searchInput = document.getElementById('searchInput');
        const modeSelect = document.getElementById('modeSelect');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const jumpInput = document.getElementById('jumpInput');
        const jumpBtn = document.getElementById('jumpBtn');
        const toggleAllAnswersBtn = document.getElementById('toggleAllAnswersBtn');
        const toggleAllText = document.getElementById('toggleAllText');
        const clearAllInputsBtn = document.getElementById('clearAllInputsBtn');

        const startIndexEl = document.getElementById('startIndex');
        const endIndexEl = document.getElementById('endIndex');
        const totalFilteredEl = document.getElementById('totalFiltered');
        const totalCountBadge = document.getElementById('totalCountBadge');

        // Initialize App
        function initApp() {
            totalCountBadge.textContent = rawQuestions.length;
            applyFilters();
            setupEventListeners();
        }

        // Apply Search, Filters and Mode
        function applyFilters() {
            const mode = modeSelect.value;
            const searchVal = searchInput.value.trim().toLowerCase();

            let list = [...rawQuestions];

            // Handle Random Modes
            if (mode.startsWith('random')) {
                const count = parseInt(mode.replace('random', ''), 10) || 10;
                list = [...rawQuestions].sort(() => 0.5 - Math.random()).slice(0, count);
            }

            // Handle Search Query
            if (searchVal) {
                list = list.filter(item => {
                    const isIdMatch = item.id.toString() === searchVal;
                    const isQMatch = item.q.toLowerCase().includes(searchVal);
                    const isAMatch = item.a.toLowerCase().includes(searchVal);
                    return isIdMatch || isQMatch || isAMatch;
                });
            }

            currentFilteredList = list;
            currentPage = 1;
            render();
        }

        // Render Question Cards & Pagination
        function render() {
            const totalItems = currentFilteredList.length;
            totalFilteredEl.textContent = totalItems;

            if (totalItems === 0) {
                questionsContainer.innerHTML = `
                    <div class="bg-white rounded-2xl p-12 text-center border border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-medium">沒有找到符合條件的題目</p>
                    </div>
                `;
                paginationControls.innerHTML = '';
                startIndexEl.textContent = '0';
                endIndexEl.textContent = '0';
                return;
            }

            // Calculate Pagination
            const totalPages = Math.ceil(totalItems / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            
            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, totalItems);

            startIndexEl.textContent = (startIdx + 1).toString();
            endIndexEl.textContent = endIdx.toString();

            const currentBatch = currentFilteredList.slice(startIdx, endIdx);

            // Check if all items on current page are revealed
            allRevealedOnPage = currentBatch.every(q => revealedAnswers[q.id]);
            updateToggleAllButtonText();

            // Build Questions HTML
            questionsContainer.innerHTML = currentBatch.map(q => {
                const userAns = userAnswers[q.id] || '';
                const isRevealed = !!revealedAnswers[q.id];

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-5 sm:p-6 transition-all hover:shadow-md">
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="flex items-center gap-2.5">
                                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-200">
                                    第 ${q.id} 題
                                </span>
                            </div>
                            <button onclick="toggleAnswer(${q.id})" 
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg transition-colors ${
                                        isRevealed 
                                        ? 'bg-amber-100 text-amber-800 hover:bg-amber-200 border border-amber-300' 
                                        : 'bg-emerald-600 text-white hover:bg-emerald-700'
                                    }">
                                <i class="fa-solid ${isRevealed ? 'fa-eye-slash' : 'fa-lightbulb'}"></i>
                                <span>${isRevealed ? '隱藏參考答案' : '顯示參考答案'}</span>
                            </button>
                        </div>

                        <!-- Question Text -->
                        <h3 class="text-base sm:text-lg font-semibold text-slate-800 leading-relaxed mb-4">
                            ${highlightKeywords(q.q)}
                        </h3>

                        <!-- Fill in the blank input field -->
                        <div class="mt-3">
                            <label class="block text-xs font-medium text-slate-500 mb-1">您的答案 (填充填寫):</label>
                            <textarea rows="2" 
                                      placeholder="請在此處輸入您的解答..." 
                                      oninput="updateUserAnswer(${q.id}, this.value)"
                                      class="w-full p-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all bg-slate-50 focus:bg-white resize-y">${escapeHtml(userAns)}</textarea>
                        </div>

                        <!-- Reference Answer Display -->
                        <div id="answer-box-${q.id}" class="${isRevealed ? 'block' : 'hidden'} mt-4 pt-4 border-t border-slate-100">
                            <div class="bg-amber-50/80 border border-amber-200/80 rounded-xl p-4 flex items-start gap-3">
                                <div class="bg-amber-500 text-white p-1.5 rounded-lg text-xs mt-0.5">
                                    <i class="fa-solid fa-check"></i>
                                </div>
                                <div class="flex-1">
                                    <span class="block text-xs font-bold uppercase tracking-wider text-amber-800 mb-0.5">參考答案 (無需批改)</span>
                                    <div class="text-sm font-semibold text-slate-800 leading-relaxed">
                                        ${escapeHtml(q.a)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        // Render Pagination Controls
        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationControls.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm"' : 'class="px-3 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-colors"'}>
                    <i class="fa-solid fa-chevron-left mr-1"></i> 上頁
                </button>
            `;

            // Pagination numbers logic
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="changePage(1)" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium">1</button>`;
                if (startPage > 2) html += `<span class="px-2 text-slate-400">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `<button class="px-3.5 py-2 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow-sm">${i}</button>`;
                } else {
                    html += `<button onclick="changePage(${i})" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-colors">${i}</button>`;
                }
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="px-2 text-slate-400">...</span>`;
                html += `<button onclick="changePage(${totalPages})" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium">${totalPages}</button>`;
            }

            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-sm"' : 'class="px-3 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-colors"'}>
                    下頁 <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            `;

            paginationControls.innerHTML = html;
        }

        // Helper Actions
        function toggleAnswer(id) {
            revealedAnswers[id] = !revealedAnswers[id];
            render();
        }

        function updateUserAnswer(id, val) {
            userAnswers[id] = val;
        }

        function changePage(newPage) {
            currentPage = newPage;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateToggleAllButtonText() {
            if (allRevealedOnPage) {
                toggleAllText.textContent = "隱藏本頁答案";
            } else {
                toggleAllText.textContent = "顯示本頁答案";
            }
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function highlightKeywords(str) {
            return escapeHtml(str);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            searchInput.addEventListener('input', applyFilters);
            modeSelect.addEventListener('change', applyFilters);

            pageSizeSelect.addEventListener('change', (e) => {
                pageSize = parseInt(e.target.value, 10);
                currentPage = 1;
                render();
            });

            // Jump to question
            const performJump = () => {
                const targetId = parseInt(jumpInput.value, 10);
                if (!targetId || targetId < 1 || targetId > 430) {
                    alert('請輸入 1 至 430 之間的有效題號');
                    return;
                }

                // Switch mode to all sequence
                modeSelect.value = 'all';
                searchInput.value = '';
                currentFilteredList = [...rawQuestions];

                const targetIndex = currentFilteredList.findIndex(q => q.id === targetId);
                if (targetIndex !== -1) {
                    currentPage = Math.floor(targetIndex / pageSize) + 1;
                    render();
                    
                    // Highlight or scroll to card
                    setTimeout(() => {
                        window.scrollTo({ top: 200, behavior: 'smooth' });
                    }, 100);
                }
            };

            jumpBtn.addEventListener('click', performJump);
            jumpInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performJump();
            });

            // Toggle Show/Hide All Answers on current page
            toggleAllAnswersBtn.addEventListener('click', () => {
                const startIdx = (currentPage - 1) * pageSize;
                const endIdx = Math.min(startIdx + pageSize, currentFilteredList.length);
                const currentBatch = currentFilteredList.slice(startIdx, endIdx);

                const nextState = !allRevealedOnPage;
                currentBatch.forEach(q => {
                    revealedAnswers[q.id] = nextState;
                });
                render();
            });

            // Clear All User Inputs
            clearAllInputsBtn.addEventListener('click', () => {
                if (Object.keys(userAnswers).length === 0) return;
                userAnswers = {};
                render();
            });
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
